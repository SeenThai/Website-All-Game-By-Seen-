<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    body {
        font-family: sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 20px;
    }

    .gallery video {
        width: 100%;
        border-radius: 10px;
        object-fit: cover;
    }

    .gallery img {
        width: 100%;
        border-radius: 10px;
        transition: 0.6s ease;

        opacity: 0;
        transform: translateY(50px);
    }

    .gallery img.show {
        opacity: 1;
        transform: translateY(0);
    }

    .gallery img:hover {
        transform: translateY(0) scale(1.05);
    }

    .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;

        justify-content: center;
        align-items: center;
    }

    .popup-content {
        background: #222;
        padding: 20px;
        border-radius: 10px;

        width: 90%;
        max-width: 800px;
        max-height: 90vh;

        overflow: auto;
    }

    .popup-content img {
        width: 100%;
        max-height: 70vh;
        object-fit: contain;
        border-radius: 10px;
    }

    #closeBtn {
        float: right;
        font-size: 28px;
        cursor: pointer;
    }
</style>


<body>

    <button id="menuBtn">☰</button>

    <div id="sidebar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">My Game</a></li>
            <li><a href="#">🎨 My Art</a></li>
            <li><a href="#">ออกจากระบบ</a></li>
        </ul>
    </div>

    <h1>🎨 My Art</h1>

    <div class="gallery" id="gallery"></div>

    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="closeBtn">&times;</span>
            <img id="popup-img" src="">
            <h2 id="popup-title"></h2>
            <p id="popup-desc"></p>
        </div>
    </div>

    <script>
        const popup = document.getElementById('popup');
        const popupImg = document.getElementById('popup-img');
        const popupTitle = document.getElementById('popup-title');
        const popupDesc = document.getElementById('popup-desc');
        const closeBtn = document.getElementById('closeBtn');

        fetch('images.json')
            .then(res => res.json())
            .then(images => {
                const gallery = document.getElementById('gallery');

                images.forEach((img, i) => {
                    let element;

                    if (img.type === "video") {
                        element = document.createElement('video');
                        element.src = 'images/' + img.file;
                        element.autoplay = true;
                        element.loop = true;
                        element.muted = true;
                    } else {
                        element = document.createElement('img');
                        element.src = 'images/' + img.file;
                    }

                    element.style.transitionDelay = (i * 0.1) + 's';

                    element.onclick = () => {
                        popup.style.display = 'flex';

                        if (img.type === "video") {
                            popupImg.style.display = "none";

                            let video = document.createElement('video');
                            video.src = element.src;
                            video.controls = true;
                            video.autoplay = true;
                            video.style.width = "100%";

                            popupImg.parentNode.insertBefore(video, popupImg.nextSibling);
                        } else {
                            popupImg.style.display = "block";
                            popupImg.src = element.src;
                        }

                        popupTitle.innerText = img.title;
                        popupDesc.innerText = img.desc;
                    };

                    gallery.appendChild(element);
                    observer.observe(element);
                });
            });



        closeBtn.onclick = () => {
            popup.style.display = 'none';

            const videos = popup.querySelectorAll('video');
            videos.forEach(v => v.remove());
        };

        popup.onclick = (e) => {
            if (e.target === popup) {
                popup.style.display = 'none';
            }
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, {
            threshold: 0.2
        });

    </script>

    <script src="script.js"></script>

</html>
